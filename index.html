<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル月間カレンダー</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #d1d5db;
      --text-main: #1f2937;
      --text-sub: #4b5563;
      --sunday-color: #dc2626;
      --saturday-color: #2563eb;
      --today-bg: #eff6ff;
      --off-bg-red: rgba(254, 226, 226, 0.55);
      --important-border: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      user-select: none;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    button {
      padding: 6px 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-main);
      transition: background 0.15s;
    }

    button:hover {
      background: #f3f4f6;
    }

    .current-month-display {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .sync-status {
      font-size: 0.8rem;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .syncing .sync-indicator {
      background: #f59e0b;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
    }

    .weekday-header {
      background: #f3f4f6;
      text-align: center;
      padding: 6px 0;
      font-weight: 700;
      font-size: 0.85rem;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .weekday-sun { color: var(--sunday-color); }
    .weekday-sat { color: var(--saturday-color); }

    .day-cell {
      min-height: 130px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 4px;
      display: flex;
      flex-direction: column;
      background: #fff;
      transition: background 0.1s;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      position: relative;
    }

    .day-cell.other-month {
      background: #fafafa;
      opacity: 0.4;
    }

    .day-cell.today {
      background-color: var(--today-bg);
      border: 2px solid #3b82f6;
    }

    .day-cell.important-day {
      border: 2.5px solid var(--important-border) !important;
      box-shadow: inset 0 0 0 1px #fecaca;
      z-index: 2;
    }

    .day-cell.am-off {
      background-image: linear-gradient(to bottom, var(--off-bg-red) 50%, rgba(255,255,255,0) 50%);
    }
    .day-cell.pm-off {
      background-image: linear-gradient(to bottom, rgba(255,255,255,0) 50%, var(--off-bg-red) 50%);
    }
    .day-cell.am-off.pm-off {
      background-image: none;
      background-color: var(--off-bg-red);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 0.85rem;
      position: relative; 
      z-index: 3; 
    }

    .day-number {
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 20px;
    }
    .sun .day-number { color: var(--sunday-color); }
    .sat .day-number { color: var(--saturday-color); }

    .day-status {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .status-flags {
      display: flex;
      gap: 3px;
      background: rgba(243, 244, 246, 0.85);
      padding: 1px 3px;
      border-radius: 3px;
      font-size: 0.72rem;
    }

    .status-flags label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .status-flags input[type="checkbox"] {
      cursor: pointer;
      width: 12px;
      height: 12px;
    }

    .mark-important {
      color: #dc2626;
      font-weight: 900;
      font-size: 0.8rem;
    }

    .leave-time-select {
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      padding: 0 1px;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
      outline: none;
      height: 20px;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-grow: 1;
      position: relative;
      z-index: 3;
    }

    .event-input {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 2px;
      padding: 2px 3px;
      font-size: 0.78rem;
      background: rgba(249, 250, 251, 0.75);
      color: var(--text-main);
      outline: none;
      transition: all 0.15s;
    }

    .event-input:hover {
      background: rgba(243, 244, 246, 0.85);
      border-color: #e5e7eb;
    }

    .event-input:focus {
      background: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px #60a5fa;
    }

    .event-input::placeholder {
      color: #9ca3af;
      font-size: 0.7rem;
    }

    @media (max-width: 600px) {
      body { padding: 4px; }
      .container { padding: 6px; }
      .day-cell { min-height: 95px; padding: 2px; }
      .day-number { font-size: 0.85rem; }
      .status-flags { font-size: 0.65rem; gap: 2px; padding: 1px 2px; }
      .event-input { font-size: 0.7rem; padding: 1px 2px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div style="display:flex; align-items:center; gap: 12px;">
      <div class="current-month-display" id="monthDisplay">----年 --月</div>
      <div class="sync-status" id="syncStatus">
        <div class="sync-indicator"></div>
        <span id="syncText">同期中...</span>
      </div>
    </div>
    <div class="nav-buttons">
      <button id="prevMonthBtn">◀ 前月</button>
      <button id="todayBtn">今月</button>
      <button id="nextMonthBtn">翌月 ▶</button>
      <button id="refreshBtn" title="クラウドから最新データを再取得">🔄 クラウド読込</button>
    </div>
  </header>

  <div class="calendar-grid" id="calendarGrid">
    <div class="weekday-header weekday-sun">日</div>
    <div class="weekday-header">月</div>
    <div class="weekday-header">火</div>
    <div class="weekday-header">水</div>
    <div class="weekday-header">木</div>
    <div class="weekday-header">金</div>
    <div class="weekday-header weekday-sat">土</div>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx0MklscF9LxXynj5Sh5RJbZXPcRVpyQqbOhZLV_QzUrBwKu-JeetE3G-04XsEBAUQ6/exec";

  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();
  const CIRCLED_NUMBERS = ["-", "①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨"];
  const STORAGE_KEY = "simple_calendar_cloud_cache_v6";

  let saveTimerMap = {}; // 入力デバウンス用

  function loadLocalData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveLocalData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function formatDateKey(year, month, day) {
    const m = String(month + 1).padStart(2, '0');
    const d = String(day).padStart(2, '0');
    return `${year}-${m}-${d}`;
  }

  function setSyncStatus(isSyncing, text) {
    const wrapper = document.getElementById("syncStatus");
    const label = document.getElementById("syncText");
    if (isSyncing) {
      wrapper.classList.add("syncing");
    } else {
      wrapper.classList.remove("syncing");
    }
    label.textContent = text;
  }

  // クラウドからデータ取得（安全マージ方式）
  function fetchCloudData() {
    setSyncStatus(true, "データ取得中...");

    const callbackName = "cb_" + Math.floor(Math.random() * 1000000);
    const script = document.createElement("script");

    window[callbackName] = function(cloudData) {
      if (cloudData && typeof cloudData === "object") {
        const local = loadLocalData();
        // クラウドのデータをベースにしつつ、ローカルで編集中（空白以外）の最新値があれば保護
        const merged = { ...cloudData };
        for (const k in local) {
          if (!merged[k]) {
            merged[k] = local[k];
          }
        }
        saveLocalData(merged);
      }
      
      renderCalendar();
      setSyncStatus(false, "同期完了");
      
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };

    script.src = `${GAS_API_URL}?callback=${callbackName}&_nocache=${Date.now()}`;
    script.onerror = function() {
      setSyncStatus(false, "オフライン（端末データ表示）");
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    document.body.appendChild(script);
  }

  // クラウドへ保存（POST）
  function triggerSaveToCloud(dateKey) {
    const data = loadLocalData();
    const dayData = data[dateKey];
    if (!dayData) return;

    setSyncStatus(true, "自動保存中...");

    const payload = {
      date: dateKey,
      amOff: !!dayData.amOff,
      pmOff: !!dayData.pmOff,
      exitTime: dayData.exitTime || "",
      events: dayData.events || ["", "", "", ""],
      isImportant: !!dayData.isImportant
    };

    fetch(GAS_API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    }).then(() => {
      setSyncStatus(false, "保存完了");
    }).catch(err => {
      setSyncStatus(false, "端末に保存済");
    });
  }

  // カレンダー描画
  function renderCalendar() {
    const data = loadLocalData();
    const grid = document.getElementById("calendarGrid");

    while (grid.children.length > 7) {
      grid.removeChild(grid.lastChild);
    }

    document.getElementById("monthDisplay").textContent = `${currentYear}年 ${currentMonth + 1}月`;

    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0);
    const startDayOfWeek = firstDay.getDay();
    const totalDays = lastDay.getDate();

    // 前月末
    const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
    for (let i = startDayOfWeek - 1; i >= 0; i--) {
      const dayNum = prevLastDay - i;
      const prevDate = new Date(currentYear, currentMonth - 1, dayNum);
      const cell = createDayCell(prevDate.getFullYear(), prevDate.getMonth(), dayNum, true, data);
      grid.appendChild(cell);
    }

    // 当月
    const today = new Date();
    for (let day = 1; day <= totalDays; day++) {
      const isToday = (today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === day);
      const cell = createDayCell(currentYear, currentMonth, day, false, data, isToday);
      grid.appendChild(cell);
    }

    // 翌月初
    const remainingCells = (7 - ((startDayOfWeek + totalDays) % 7)) % 7;
    for (let day = 1; day <= remainingCells; day++) {
      const nextDate = new Date(currentYear, currentMonth + 1, day);
      const cell = createDayCell(nextDate.getFullYear(), nextDate.getMonth(), day, true, data);
      grid.appendChild(cell);
    }
  }

  // 単一日セル作成
  function createDayCell(year, month, day, isOtherMonth, allData, isToday = false) {
    const dateKey = formatDateKey(year, month, day);
    const dayData = allData[dateKey] || { amOff: false, pmOff: false, exitTime: "", events: ["", "", "", ""], isImportant: false };

    const dateObj = new Date(year, month, day);
    const dayOfWeek = dateObj.getDay();

    const cell = document.createElement("div");
    cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${dayOfWeek === 0 ? 'sun' : ''} ${dayOfWeek === 6 ? 'sat' : ''} ${dayData.amOff ? 'am-off' : ''} ${dayData.pmOff ? 'pm-off' : ''} ${dayData.isImportant ? 'important-day' : ''}`;

    const header = document.createElement("div");
    header.className = "day-header";

    const dayNumber = document.createElement("span");
    dayNumber.className = "day-number";
    dayNumber.textContent = day;

    const statusGroup = document.createElement("div");
    statusGroup.className = "day-status";

    const statusFlags = document.createElement("div");
    statusFlags.className = "status-flags";

    // 1. 重要（！）チェック
    const impLabel = document.createElement("label");
    impLabel.title = "重要日（太枠表示）";
    const impCheck = document.createElement("input");
    impCheck.type = "checkbox";
    impCheck.checked = !!dayData.isImportant;
    impCheck.addEventListener("change", () => {
      updateDayData(dateKey, { isImportant: impCheck.checked });
      cell.classList.toggle('important-day', impCheck.checked);
      triggerSaveToCloud(dateKey);
    });
    const impText = document.createElement("span");
    impText.className = "mark-important";
    impText.textContent = "!";
    impLabel.appendChild(impCheck);
    impLabel.appendChild(impText);

    // 2. 午前休チェック
    const amLabel = document.createElement("label");
    amLabel.title = "午前休";
    const amCheck = document.createElement("input");
    amCheck.type = "checkbox";
    amCheck.checked = !!dayData.amOff;
    amCheck.addEventListener("change", () => {
      updateDayData(dateKey, { amOff: amCheck.checked });
      cell.classList.toggle('am-off', amCheck.checked);
      triggerSaveToCloud(dateKey);
    });
    amLabel.appendChild(amCheck);
    amLabel.appendChild(document.createTextNode("前"));

    // 3. 午後休チェック
    const pmLabel = document.createElement("label");
    pmLabel.title = "午後休";
    const pmCheck = document.createElement("input");
    pmCheck.type = "checkbox";
    pmCheck.checked = !!dayData.pmOff;
    pmCheck.addEventListener("change", () => {
      updateDayData(dateKey, { pmOff: pmCheck.checked });
      cell.classList.toggle('pm-off', pmCheck.checked);
      triggerSaveToCloud(dateKey);
    });
    pmLabel.appendChild(pmCheck);
    pmLabel.appendChild(document.createTextNode("後"));

    statusFlags.appendChild(impLabel);
    statusFlags.appendChild(amLabel);
    statusFlags.appendChild(pmLabel);

    // 退勤丸数字
    const timeSelect = document.createElement("select");
    timeSelect.className = "leave-time-select";

    const emptyOpt = document.createElement("option");
    emptyOpt.value = "";
    emptyOpt.textContent = "—";
    timeSelect.appendChild(emptyOpt);

    for (let n = 1; n <= 9; n++) {
      const opt = document.createElement("option");
      opt.value = CIRCLED_NUMBERS[n];
      opt.textContent = CIRCLED_NUMBERS[n];
      if (dayData.exitTime === CIRCLED_NUMBERS[n]) opt.selected = true;
      timeSelect.appendChild(opt);
    }

    timeSelect.addEventListener("change", () => {
      updateDayData(dateKey, { exitTime: timeSelect.value });
      triggerSaveToCloud(dateKey);
    });

    statusGroup.appendChild(statusFlags);
    statusGroup.appendChild(timeSelect);
    header.appendChild(dayNumber);
    header.appendChild(statusGroup);
    cell.appendChild(header);

    // 予定入力枠（4行）
    const eventsList = document.createElement("div");
    eventsList.className = "events-list";

    for (let i = 0; i < 4; i++) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "event-input";
      input.placeholder = `予定 ${i + 1}`;
      input.value = (dayData.events && dayData.events[i]) ? dayData.events[i] : "";

      // 💡 入力された瞬間にローカルへ即保存＆入力終了から800ms後にクラウドへ自動送信
      input.addEventListener("input", () => {
        const currentData = loadLocalData()[dateKey] || { amOff: false, pmOff: false, exitTime: "", events: ["", "", "", ""], isImportant: false };
        const newEvents = [...(currentData.events || ["", "", "", ""])];
        newEvents[i] = input.value;
        updateDayData(dateKey, { events: newEvents });

        // デバウンス送信（タイプが止まったら自動送信）
        clearTimeout(saveTimerMap[dateKey]);
        setSyncStatus(true, "編集中...");
        saveTimerMap[dateKey] = setTimeout(() => {
          triggerSaveToCloud(dateKey);
        }, 800);
      });

      eventsList.appendChild(input);
    }

    cell.appendChild(eventsList);
    return cell;
  }

  function updateDayData(dateKey, diff) {
    const data = loadLocalData();
    if (!data[dateKey]) {
      data[dateKey] = { amOff: false, pmOff: false, exitTime: "", events: ["", "", "", ""], isImportant: false };
    }
    data[dateKey] = { ...data[dateKey], ...diff };
    saveLocalData(data);
    return data[dateKey];
  }

  document.getElementById("prevMonthBtn").addEventListener("click", () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  });

  document.getElementById("nextMonthBtn").addEventListener("click", () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  });

  document.getElementById("todayBtn").addEventListener("click", () => {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
  });

  document.getElementById("refreshBtn").addEventListener("click", () => {
    fetchCloudData();
  });

  // 初回起動：ローカル描画 ➔ クラウドから安全マージ取得
  renderCalendar();
  fetchCloudData();
</script>
</body>
</html>
